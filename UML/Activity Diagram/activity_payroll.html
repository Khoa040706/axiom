<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Diagram – Payroll (Quản lý Tiền lương)</title>
  <style>

      margin: 0;
      padding: 0

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      display: flex;
      justify-content: center;
      padding: 20px 8px
    }

    .wrap {
      overflow: auto;
      width: 100%
    }

    svg {
      display: block;
      margin: 0 auto
    }
  </style>
</head>

<body>
  <div class="wrap">
    <svg width="1480" height="1680" viewBox="0 0 1480 1680" xmlns="http://www.w3.org/2000/svg" style="background:#fff">
      <defs>
        <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
          <path d="M0,0 L10,4 L0,8 L2,4z" fill="#333" />
        </marker>
      </defs>

      <!-- TITLE -->
      <text x="725" y="28" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold"
        fill="#222">Activity Diagram – Phân hệ Quản lý Tiền lương (Payroll)</text>

      <!-- OUTER BORDER -->
      <rect x="30" y="45" width="1390" height="1502" fill="none" stroke="#999" stroke-width="1.5" rx="4" />

      <!-- ======= SWIMLANE HEADERS ======= -->
      <!-- Lane 1: Admin/HR (30 → 430) -->
      <rect x="30" y="45" width="400" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1.5" />
      <text x="230" y="70" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#333">Admin
        / HR (Kế toán)</text>

      <!-- Lane 2: Nhân viên (430 → 730) -->
      <rect x="430" y="45" width="300" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1.5" />
      <text x="580" y="70" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#333">Nhân
        viên</text>

      <!-- Lane 3: Hệ thống (730 → 1420) -->
      <rect x="730" y="45" width="690" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1.5" />
      <text x="1075" y="70" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#333">Hệ
        thống</text>

      <!-- Dividers -->
      <line x1="430" y1="45" x2="430" y2="1545" stroke="#bbb" stroke-width="1" stroke-dasharray="6,3" />
      <line x1="730" y1="45" x2="730" y2="1545" stroke="#bbb" stroke-width="1" stroke-dasharray="6,3" />

      <!-- ======= BƯỚC 1: ĐĂNG NHẬP & THIẾT LẬP LƯƠNG ======= -->
      <!-- Initial node (Admin/HR) -->
      <circle cx="230" cy="120" r="11" fill="#333" />
      <line x1="230" y1="131" x2="230" y2="158" stroke="#333" stroke-width="1.5" marker-end="url(#a)" />

      <!-- Đăng nhập hệ thống -->
      <rect x="140" y="163" width="180" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5" />
      <text x="230" y="185" text-anchor="middle" font-family="Arial" font-size="11">Đăng nhập hệ thống</text>

      <line x1="230" y1="199" x2="230" y2="230" stroke="#333" stroke-width="1.5" marker-end="url(#a)" />

      <!-- Thiết lập công thức lương -->
      <rect x="60" y="235" width="340" height="58" rx="16" fill="#fff" stroke="#333" stroke-width="1.5" />
      <text x="230" y="258" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">Thiết lập công
        thức lương:</text>
      <text x="230" y="273" text-anchor="middle" font-family="Arial" font-size="10">Lương cơ bản · Hệ số · Phụ
        cấp</text>
      <text x="230" y="286" text-anchor="middle" font-family="Arial" font-size="10">BHXH · BHYT · BHTN · Thuế
        TNCN</text>

      <!-- Arrow: Thiết lập → Hệ thống lưu config -->
      <line x1="400" y1="264" x2="780" y2="264" stroke="#333" stroke-width="1.5" marker-end="url(#a)" />
      <text x="590" y="256" text-anchor="middle" font-family="Arial" font-size="9" fill="#555" font-style="italic">[Lưu
        cấu hình lương]</text>

      <!-- Lưu cấu hình lương vào CSDL -->
      <rect x="785" y="245" width="215" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5" />
      <text x="893" y="267" text-anchor="middle" font-family="Arial" font-size="11">Lưu cấu hình lương vào CSDL</text>

      <!-- Confirm back -->
      <path d="M893,281 L893,310 L230,310 L230,328" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)" />
      <text x="560" y="305" text-anchor="middle" font-family="Arial" font-size="9" fill="#555" font-style="italic">[Xác
        nhận lưu thành công]</text>

      <!-- ======= BƯỚC 2: CHỌN KỲ LƯƠNG ======= -->
      <!-- Chọn kỳ tính lương -->
      <rect x="110" y="333" width="240" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5" />
      <text x="230" y="355" text-anchor="middle" font-family="Arial" font-size="11">Chọn kỳ tính lương
        (tháng/quý)</text>

      <line x1="230" y1="369" x2="230" y2="400" stroke="#333" stroke-width="1.5" marker-end="url(#a)" />

      <!-- ======= BƯỚC 3: HỆ THỐNG TỔNG HỢP DỮ LIỆU ======= -->
      <!-- Fork: 2 luồng song song -->
      <rect x="100" y="405" width="260" height="5" rx="2" fill="#333" />

      <!-- Branch A: Admin chờ -->
      <line x1="160" y1="410" x2="160" y2="435" stroke="#333" stroke-width="1.5" marker-end="url(#a)" />
      <rect x="80" y="440" width="160" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
      <text x="160" y="458" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Chờ hệ thống</text>
      <text x="160" y="471" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">xử lý...</text>

      <!-- Branch B: Hệ thống tổng hợp -->
      <line x1="300" y1="410" x2="780" y2="410" stroke="#333" stroke-width="1.5" marker-end="url(#a)" />

      <!-- Fork ở Hệ thống: 2 nguồn dữ liệu song song -->
      <rect x="780" y="407" width="400" height="5" rx="2" fill="#333" />

      <!-- Source 1: Dữ liệu chấm công -->
      <line x1="880" y1="412" x2="880" y2="440" stroke="#333" stroke-width="1.5" marker-end="url(#a)" />
      <rect x="795" y="445" width="170" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5" />
      <text x="880" y="460" text-anchor="middle" font-family="Arial" font-size="10">Tổng hợp dữ liệu</text>
      <text x="880" y="473" text-anchor="middle" font-family="Arial" font-size="10">chấm công (ngày/OT)</text>

      <!-- Source 2: Dữ liệu nghỉ phép -->
      <line x1="1080" y1="412" x2="1080" y2="440" stroke="#333" stroke-width="1.5" marker-end="url(#a)" />
      <rect x="995" y="445" width="170" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5" />
      <text x="1080" y="460" text-anchor="middle" font-family="Arial" font-size="10">Tổng hợp dữ liệu</text>
      <text x="1080" y="473" text-anchor="middle" font-family="Arial" font-size="10">nghỉ phép (phép năm)</text>

      <!-- Join: 2 nguồn về 1 -->
      <line x1="880" y1="481" x2="880" y2="510" stroke="#333" stroke-width="1.5" />
      <line x1="1080" y1="481" x2="1080" y2="510" stroke="#333" stroke-width="1.5" />
      <rect x="780" y="510" width="400" height="5" rx="2" fill="#333" />

      <line x1="980" y1="515" x2="980" y2="545" stroke="#333" stroke-width="1.5" marker-end="url(#a)" />

      <!-- Decision: Dữ liệu đầy đủ? -->
      <polygon points="980,550 1050,590 980,630 910,590" fill="#fff" stroke="#333" stroke-width="1.5" />
      <text x="980" y="587" text-anchor="middle" font-family="Arial" font-size="10">Dữ liệu</text>
      <text x="980" y="599" text-anchor="middle" font-family="Arial" font-size="10">đầy đủ?</text>

      <!-- No branch: vòng lặp báo lỗi -->
      <line x1="1050" y1="590" x2="1323" y2="590" stroke="#333" stroke-width="1.5" />
      <text x="1120" y="582" font-family="Arial" font-size="10" fill="#333" font-weight="bold">[No]</text>
      <line x1="1323" y1="590" x2="1323" y2="543" stroke="#333" stroke-width="1.5" marker-end="url(#a)" />

      <!-- Thông báo lỗi dữ liệu (x=1255, clear of join bar ending at x=1180) -->
      <rect x="1240" y="505" width="165" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5" />
      <text x="1323" y="520" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Thông báo lỗi:</text>
      <text x="1323" y="533" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Thiếu dữ liệu</text>

      <!-- Arrow: Thông báo lỗi → Admin/HR -->
      <line x1="1240" y1="523" x2="362" y2="523" stroke="#333" stroke-width="1.5" marker-end="url(#a)" />
      <text x="830" y="537" text-anchor="middle" font-family="Arial" font-size="9" fill="#555" font-style="italic">[Yêu
        cầu bổ sung dữ liệu]</text>

      <!-- Admin nhận thông báo -->
      <rect x="170" y="505" width="190" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5" />
      <text x="265" y="521" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Nhận thông báo
        lỗi</text>
      <text x="265" y="534" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">&amp; bổ sung dữ
        liệu</text>

      <!-- Loop arrow back to Chọn kỳ -->
      <path d="M170,523 L45,523 L45,350 L110,350" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3"
        marker-end="url(#a)" />
      <text x="50" y="430" font-family="Arial" font-size="9" fill="#333" font-style="italic"
        transform="rotate(-90,50,440)">Thử lại</text>

      <!-- Yes branch -->
      <line x1="980" y1="630" x2="980" y2="660" stroke="#333" stroke-width="1.5" marker-end="url(#a)" />
      <text x="993" y="650" font-family="Arial" font-size="10" fill="#333" font-weight="bold">[Yes]</text>

      <!-- ======= BƯỚC 4: TÍNH LƯƠNG ======= -->
      <rect x="850" y="665" width="260" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5" />
      <text x="980" y="687" text-anchor="middle" font-family="Arial" font-size="11">Tính lương tự động (Gross /
        Net)</text>

      <!-- Arrow: Hệ thống → join bar (enter from right side) -->
      <line x1="850" y1="700" x2="362" y2="700" stroke="#333" stroke-width="1.5" marker-end="url(#a)" />
      <text x="640" y="693" text-anchor="middle" font-family="Arial" font-size="9" fill="#555" font-style="italic">[Kết
        quả bảng lương]</text>

      <!-- Join: Admin chờ + Bảng lương về -->
      <line x1="160" y1="476" x2="160" y2="700" stroke="#333" stroke-width="1.5" />
      <rect x="100" y="700" width="260" height="5" rx="2" fill="#333" />

      <line x1="230" y1="705" x2="230" y2="735" stroke="#333" stroke-width="1.5" marker-end="url(#a)" />

      <!-- Kiểm tra bảng lương -->
      <rect x="110" y="740" width="240" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5" />
      <text x="230" y="762" text-anchor="middle" font-family="Arial" font-size="11">Kiểm tra bảng lương chi tiết</text>

      <line x1="230" y1="776" x2="230" y2="808" stroke="#333" stroke-width="1.5" marker-end="url(#a)" />

      <!-- Decision: Phê duyệt? -->
      <polygon points="230,812 305,852 230,892 155,852" fill="#fff" stroke="#333" stroke-width="1.5" />
      <text x="230" y="849" text-anchor="middle" font-family="Arial" font-size="10">Phê duyệt</text>
      <text x="230" y="861" text-anchor="middle" font-family="Arial" font-size="10">bảng lương?</text>

      <!-- No: Yêu cầu tính lại -->
      <line x1="155" y1="852" x2="65" y2="852" stroke="#333" stroke-width="1.5" />
      <text x="100" y="844" font-family="Arial" font-size="10" fill="#333" font-weight="bold">[No]</text>
      <line x1="65" y1="852" x2="65" y2="350" stroke="#333" stroke-width="1.5" />
      <line x1="65" y1="350" x2="110" y2="350" stroke="#333" stroke-width="1.5" marker-end="url(#a)" />
      <text x="52" y="620" font-family="Arial" font-size="9" fill="#333" font-style="italic"
        transform="rotate(-90,52,620)">Yêu cầu tính lại</text>

      <!-- Yes: Phê duyệt -->
      <line x1="230" y1="892" x2="230" y2="925" stroke="#333" stroke-width="1.5" marker-end="url(#a)" />
      <text x="245" y="912" font-family="Arial" font-size="10" fill="#333" font-weight="bold">[Yes]</text>

      <!-- Phê duyệt chính thức -->
      <rect x="100" y="930" width="260" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5" />
      <text x="230" y="952" text-anchor="middle" font-family="Arial" font-size="11">Phê duyệt bảng lương chính
        thức</text>

      <!-- Arrow: Phê duyệt → Hệ thống xuất phiếu -->
      <line x1="360" y1="948" x2="780" y2="948" stroke="#333" stroke-width="1.5" marker-end="url(#a)" />
      <text x="570" y="940" text-anchor="middle" font-family="Arial" font-size="9" fill="#555" font-style="italic">[Xác
        nhận phê duyệt]</text>

      <!-- ======= BƯỚC 6: HỆ THỐNG XUẤT PHIẾU LƯƠNG ======= -->
      <rect x="785" y="930" width="215" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5" />
      <text x="893" y="952" text-anchor="middle" font-family="Arial" font-size="11">Xuất phiếu lương (Payslip)</text>

      <line x1="893" y1="966" x2="893" y2="995" stroke="#333" stroke-width="1.5" marker-end="url(#a)" />

      <!-- Gửi phiếu lương cho nhân viên -->
      <rect x="785" y="1000" width="215" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5" />
      <text x="893" y="1022" text-anchor="middle" font-family="Arial" font-size="11">Gửi phiếu lương cho NV</text>

      <!-- Arrow: Gửi phiếu → Nhân viên nhận -->
      <line x1="785" y1="1018" x2="730" y2="1018" stroke="#333" stroke-width="1.5" marker-end="url(#a)" />

      <!-- ======= NHÂN VIÊN: NHẬN PHIẾU LƯƠNG ======= -->
      <!-- Initial note: NV chỉ nhận phiếu -->
      <rect x="445" y="1000" width="280" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5" />
      <text x="585" y="1022" text-anchor="middle" font-family="Arial" font-size="11">Nhận &amp; xem phiếu lương của
        mình</text>

      <line x1="585" y1="1036" x2="585" y2="1065" stroke="#333" stroke-width="1.5" marker-end="url(#a)" />

      <!-- Decision: Thắc mắc? -->
      <polygon points="585,1068 650,1100 585,1132 520,1100" fill="#fff" stroke="#333" stroke-width="1.5" />
      <text x="585" y="1097" text-anchor="middle" font-family="Arial" font-size="10">Có thắc</text>
      <text x="585" y="1109" text-anchor="middle" font-family="Arial" font-size="10">mắc?</text>

      <!-- No: Kết thúc -->
      <line x1="650" y1="1100" x2="720" y2="1100" stroke="#333" stroke-width="1.5" />
      <text x="685" y="1092" font-family="Arial" font-size="10" fill="#333" font-weight="bold">[No]</text>
      <line x1="720" y1="1100" x2="720" y2="1118" stroke="#333" stroke-width="1.5" />
      <circle cx="720" cy="1128" r="9" fill="#fff" stroke="#333" stroke-width="2" />
      <circle cx="720" cy="1128" r="4.5" fill="#333" />

      <!-- Yes: Gửi yêu cầu giải trình -->
      <line x1="585" y1="1132" x2="585" y2="1165" stroke="#333" stroke-width="1.5" marker-end="url(#a)" />
      <text x="600" y="1152" font-family="Arial" font-size="10" fill="#333" font-weight="bold">[Yes]</text>

      <!-- NV: Gửi yêu cầu giải trình lên HR -->
      <rect x="445" y="1168" width="275" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5" />
      <text x="582" y="1190" text-anchor="middle" font-family="Arial" font-size="11">Gửi yêu cầu giải trình lên
        HR</text>

      <!-- Arrow cross-lane NV → HR (horizontal at mid of box) -->
      <line x1="445" y1="1186" x2="350" y2="1186" stroke="#333" stroke-width="1.5" marker-end="url(#a)" />

      <!-- HR: Nhận & xem xét yêu cầu -->
      <rect x="65" y="1168" width="270" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5" />
      <text x="200" y="1190" text-anchor="middle" font-family="Arial" font-size="11">Nhận &amp; xem xét yêu cầu</text>

      <line x1="200" y1="1204" x2="200" y2="1234" stroke="#333" stroke-width="1.5" marker-end="url(#a)" />

      <!-- Decision: Yêu cầu hợp lệ? — center x=200, y=1238..1304 -->
      <polygon points="200,1238 278,1271 200,1304 122,1271" fill="#fff" stroke="#333" stroke-width="1.5" />
      <text x="200" y="1268" text-anchor="middle" font-family="Arial" font-size="10">Yêu cầu</text>
      <text x="200" y="1280" text-anchor="middle" font-family="Arial" font-size="10">hợp lệ?</text>

      <!-- [Yes] down → Điều chỉnh lương -->
      <line x1="200" y1="1304" x2="200" y2="1332" stroke="#333" stroke-width="1.5" marker-end="url(#a)" />
      <text x="215" y="1322" font-family="Arial" font-size="10" fill="#333" font-weight="bold">[Yes]</text>
      <rect x="65" y="1336" width="270" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5" />
      <text x="200" y="1358" text-anchor="middle" font-family="Arial" font-size="11">Điều chỉnh &amp; tính lại
        lương</text>

      <!-- Arrow HR → System: Cập nhật -->
      <line x1="335" y1="1354" x2="785" y2="1354" stroke="#333" stroke-width="1.5" marker-end="url(#a)" />
      <text x="560" y="1346" text-anchor="middle" font-family="Arial" font-size="9" fill="#555" font-style="italic">[Cập
        nhật bảng lương]</text>

      <!-- System: Cập nhật & gửi phiếu lương mới -->
      <rect x="790" y="1336" width="215" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5" />
      <text x="897" y="1354" text-anchor="middle" font-family="Arial" font-size="10">Cập nhật &amp; gửi</text>
      <text x="897" y="1367" text-anchor="middle" font-family="Arial" font-size="10">phiếu lương mới</text>

      <!-- Arrow System → NV lane (right side of merge, going left then down to merge) -->
      <line x1="790" y1="1354" x2="730" y2="1354" stroke="#333" stroke-width="1.5" />
      <line x1="730" y1="1354" x2="730" y2="1420" stroke="#333" stroke-width="1.5" />
      <line x1="730" y1="1420" x2="648" y2="1420" stroke="#333" stroke-width="1.5" />

      <!-- [No] right from decision → HR box → cross to NV -->
      <line x1="278" y1="1271" x2="430" y2="1271" stroke="#333" stroke-width="1.5" />
      <text x="350" y="1263" font-family="Arial" font-size="10" fill="#333" font-weight="bold">[No]</text>
      <!-- HR thông báo không hợp lệ (floating in HR/NV boundary area) -->
      <rect x="340" y="1248" width="178" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5" />
      <text x="429" y="1263" text-anchor="middle" font-family="Arial" font-size="10">Thông báo yêu cầu</text>
      <text x="429" y="1276" text-anchor="middle" font-family="Arial" font-size="10">không hợp lệ</text>

      <!-- Arrow from No box → NV lane merge (top of merge) -->
      <line x1="518" y1="1271" x2="582" y2="1271" stroke="#333" stroke-width="1.5" />
      <line x1="582" y1="1271" x2="582" y2="1400" stroke="#333" stroke-width="1.5" />

      <!-- Merge diamond — center x=582, y=1400..1440 -->
      <polygon points="582,1400 648,1420 582,1440 516,1420" fill="#fff" stroke="#333" stroke-width="1.5" />
      <!-- Input from [No] top path -->
      <line x1="582" y1="1400" x2="582" y2="1400" stroke="#333" stroke-width="1" />
      <!-- Input from [Yes]/System right path -->
      <line x1="648" y1="1420" x2="648" y2="1420" stroke="#333" stroke-width="1" />
