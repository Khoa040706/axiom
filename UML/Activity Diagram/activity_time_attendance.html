<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Diagram – Time &amp; Attendance (Chấm công &amp; Nghỉ phép)</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;background:#fff;display:flex;justify-content:center;padding:20px 8px}
    .wrap{overflow:auto;width:100%}
    svg{display:block;margin:0 auto}
  </style>
</head>
<body>
<div class="wrap">
<svg width="1280" height="1280" viewBox="0 0 1280 1280" xmlns="http://www.w3.org/2000/svg" style="background:#fff">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 L2,4z" fill="#333"/>
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="640" y="28" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#222">Activity Diagram – Phân hệ Quản lý Thời gian &amp; Nghỉ phép (Time &amp; Attendance)</text>

  <!-- OUTER BORDER -->
  <rect x="30" y="45" width="1220" height="1180" fill="none" stroke="#999" stroke-width="1.5" rx="4"/>

  <!-- ======= SWIMLANE HEADERS ======= -->
  <rect x="30"  y="45" width="360" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/>
  <text x="210" y="70" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#333">Nhân viên</text>

  <rect x="390" y="45" width="310" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/>
  <text x="545" y="70" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#333">Trưởng phòng</text>

  <rect x="700" y="45" width="550" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/>
  <text x="975" y="70" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#333">Hệ thống</text>

  <line x1="390"  y1="45" x2="390"  y2="1225" stroke="#bbb" stroke-width="1" stroke-dasharray="6,3"/>
  <line x1="700"  y1="45" x2="700"  y2="1225" stroke="#bbb" stroke-width="1" stroke-dasharray="6,3"/>

  <!-- ======= PHẦN 1: CHẤM CÔNG ======= -->
  <!-- Separator label -->
  <rect x="40" y="88" width="180" height="18" fill="#e3f2fd" rx="3"/>
  <text x="130" y="101" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#1565c0" font-weight="bold">① Luồng Chấm công</text>

  <!-- Initial Node (NV) -->
  <circle cx="210" cy="118" r="11" fill="#333"/>
  <line x1="210" y1="129" x2="210" y2="155" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Đăng nhập -->
  <rect x="125" y="160" width="170" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="210" y="182" text-anchor="middle" font-family="Arial" font-size="11">Đăng nhập hệ thống</text>
  <line x1="210" y1="196" x2="210" y2="225" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Fork: 3 nhánh song song NV -->
  <rect x="55" y="230" width="310" height="5" rx="2" fill="#333"/>

  <!-- Branch 1: Check-in -->
  <line x1="110" y1="235" x2="110" y2="260" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="50"  y="265" width="120" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="110" y="287" text-anchor="middle" font-family="Arial" font-size="11">Check-in</text>

  <!-- Branch 2: Check-out -->
  <line x1="210" y1="235" x2="210" y2="260" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="150" y="265" width="120" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="210" y="287" text-anchor="middle" font-family="Arial" font-size="11">Check-out</text>

  <!-- Branch 3: Đăng ký nghỉ phép -->
  <line x1="315" y1="235" x2="315" y2="260" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="245" y="265" width="140" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="315" y="280" text-anchor="middle" font-family="Arial" font-size="10">Đăng ký nghỉ phép</text>
  <text x="315" y="293" text-anchor="middle" font-family="Arial" font-size="10">(ốm / năm / việc riêng)</text>

  <!-- Join -->
  <line x1="110" y1="301" x2="110" y2="330" stroke="#333" stroke-width="1.5"/>
  <line x1="210" y1="301" x2="210" y2="330" stroke="#333" stroke-width="1.5"/>
  <line x1="315" y1="301" x2="315" y2="330" stroke="#333" stroke-width="1.5"/>
  <rect x="55" y="330" width="310" height="5" rx="2" fill="#333"/>

  <!-- Arrows cross to Hệ thống: check-in/out data -->
  <line x1="365" y1="280" x2="700" y2="375" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="520" y="318" text-anchor="middle" font-family="Arial" font-size="9" fill="#555" font-style="italic">[Ghi nhận check-in/out]</text>

  <!-- ======= HỆ THỐNG: GHI NHẬN CHẤM CÔNG ======= -->
  <!-- Initial node system (tổng hợp cuối ngày) -->
  <circle cx="870" cy="118" r="11" fill="#333"/>
  <line x1="870" y1="129" x2="870" y2="155" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Ghi nhận thời gian vào/ra -->
  <rect x="710" y="160" width="250" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="835" y="182" text-anchor="middle" font-family="Arial" font-size="11">Ghi nhận thời gian vào / ra</text>

  <line x1="835" y1="196" x2="835" y2="225" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Decision: Đi muộn / về sớm? -->
  <polygon points="835,230 905,268 835,306 765,268" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="835" y="265" text-anchor="middle" font-family="Arial" font-size="10">Đi muộn /</text>
  <text x="835" y="277" text-anchor="middle" font-family="Arial" font-size="10">về sớm?</text>

  <!-- Yes: ghi phút vi phạm -->
  <line x1="835" y1="306" x2="835" y2="335" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="850" y="325" font-family="Arial" font-size="10" fill="#333" font-weight="bold">[Yes]</text>

  <rect x="710" y="340" width="250" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="835" y="360" text-anchor="middle" font-family="Arial" font-size="11">Ghi nhận số phút vi phạm</text>

  <!-- No: bỏ qua -->
  <line x1="905" y1="268" x2="990" y2="268" stroke="#333" stroke-width="1.5"/>
  <text x="945" y="260" font-family="Arial" font-size="10" fill="#333" font-weight="bold">[No]</text>
  <line x1="990" y1="268" x2="990" y2="376" stroke="#333" stroke-width="1.5"/>
  <!-- Merge -->
  <line x1="835" y1="376" x2="835" y2="400" stroke="#333" stroke-width="1.5"/>
  <line x1="990" y1="376" x2="835" y2="376" stroke="#333" stroke-width="1.5"/>

  <!-- Tổng hợp ngày công cuối ngày -->
  <rect x="700" y="405" width="280" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="840" y="427" text-anchor="middle" font-family="Arial" font-size="11">Tổng hợp ngày công &amp; giờ OT</text>

  <!-- ======= SEPARATOR: PHẦN 2 – NGHỈ PHÉP ======= -->
  <line x1="40" y1="460" x2="1240" y2="460" stroke="#aaa" stroke-width="1" stroke-dasharray="8,4"/>
  <rect x="40" y="463" width="220" height="18" fill="#fff8e1" rx="3"/>
  <text x="150" y="476" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#333" font-weight="bold">② Luồng Đăng ký &amp; Duyệt nghỉ phép</text>

  <!-- ======= PHẦN 2: ĐĂNG KÝ NGHỈ PHÉP ======= -->
  <!-- NV gửi đơn -->
  <line x1="315" y1="335" x2="315" y2="485" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="105" y="490" width="245" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="228" y="512" text-anchor="middle" font-family="Arial" font-size="11">Điền &amp; gửi đơn xin nghỉ phép</text>

  <!-- Arrow cross to Trưởng phòng -->
  <line x1="350" y1="508" x2="388" y2="508" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- TP nhận đơn -->
  <rect x="393" y="490" width="265" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="525" y="508" text-anchor="middle" font-family="Arial" font-size="11">Nhận &amp; xem xét đơn nghỉ phép</text>

  <line x1="525" y1="526" x2="525" y2="558" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Decision: Duyệt? -->
  <polygon points="525,562 600,602 525,642 450,602" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="525" y="599" text-anchor="middle" font-family="Arial" font-size="10">Phê duyệt</text>
  <text x="525" y="611" text-anchor="middle" font-family="Arial" font-size="10">nghỉ phép?</text>

  <!-- No: Từ chối -->
  <line x1="450" y1="602" x2="370" y2="602" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="400" y="594" font-family="Arial" font-size="10" fill="#333" font-weight="bold">[No]</text>

  <rect x="105" y="584" width="265" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="238" y="607" text-anchor="middle" font-family="Arial" font-size="11">Nhận thông báo bị từ chối</text>

  <!-- NV có thể gửi lại -->
  <line x1="238" y1="620" x2="238" y2="650" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <polygon points="238,654 305,690 238,726 171,690" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="238" y="687" text-anchor="middle" font-family="Arial" font-size="10">Gửi lại</text>
  <text x="238" y="699" text-anchor="middle" font-family="Arial" font-size="10">đơn?</text>

  <!-- Yes: Gửi lại -->
  <line x1="238" y1="726" x2="238" y2="750" stroke="#333" stroke-width="1.5"/>
  <text x="253" y="742" font-family="Arial" font-size="10" fill="#333" font-weight="bold">[Yes]</text>
  <line x1="238" y1="750" x2="80"  y2="750" stroke="#333" stroke-width="1.5"/>
  <line x1="80"  y1="750" x2="80"  y2="500" stroke="#333" stroke-width="1.5"/>
  <line x1="80"  y1="500" x2="105" y2="500" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- No: Kết thúc NV -->
  <line x1="305" y1="690" x2="360" y2="690" stroke="#333" stroke-width="1.5"/>
  <text x="330" y="682" font-family="Arial" font-size="10" fill="#333" font-weight="bold">[No]</text>
  <line x1="360" y1="690" x2="360" y2="760" stroke="#333" stroke-width="1.5"/>
  <circle cx="360" cy="770" r="9" fill="#fff" stroke="#333" stroke-width="2"/>
  <circle cx="360" cy="770" r="4.5" fill="#333"/>

  <!-- Yes: Duyệt TP → Hệ thống -->
  <line x1="525" y1="642" x2="525" y2="680" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="540" y="665" font-family="Arial" font-size="10" fill="#333" font-weight="bold">[Yes]</text>

  <!-- Arrow Yes → Hệ thống -->
  <line x1="658" y1="695" x2="700" y2="695" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- TP ghi nhận duyệt -->
  <rect x="393" y="680" width="265" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="525" y="702" text-anchor="middle" font-family="Arial" font-size="11">Xác nhận phê duyệt nghỉ phép</text>

  <!-- ======= HỆ THỐNG: XỬ LÝ DUYỆT ======= -->
  <!-- Fork: 2 luồng song song -->
  <rect x="700" y="692" width="480" height="5" rx="2" fill="#333"/>

  <!-- Branch A: Trừ quỹ phép -->
  <line x1="820" y1="697" x2="820" y2="725" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="710" y="730" width="220" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="820" y="748" text-anchor="middle" font-family="Arial" font-size="11">Trừ quỹ phép năm</text>

  <!-- Branch B: Cập nhật công tác -->
  <line x1="1050" y1="697" x2="1050" y2="725" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="940"  y="730" width="265" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="1073" y="748" text-anchor="middle" font-family="Arial" font-size="11">Cập nhật lệnh công tác &amp; phụ cấp</text>

  <!-- Join -->
  <line x1="820"  y1="766" x2="820"  y2="795" stroke="#333" stroke-width="1.5"/>
  <line x1="1050" y1="766" x2="1050" y2="795" stroke="#333" stroke-width="1.5"/>
  <rect x="700"  y="795" width="480" height="5" rx="2" fill="#333"/>

  <line x1="940" y1="800" x2="940" y2="832" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Thông báo kết quả cho NV -->
  <rect x="790" y="837" width="300" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="940" y="859" text-anchor="middle" font-family="Arial" font-size="11">Gửi thông báo kết quả cho NV</text>

  <!-- Arrow → NV nhận thông báo duyệt -->
  <line x1="790" y1="855" x2="370" y2="855" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="580" y="847" text-anchor="middle" font-family="Arial" font-size="9" fill="#555" font-style="italic">[Thông báo đã duyệt]</text>

  <!-- NV nhận thông báo duyệt -->
  <rect x="90" y="837" width="280" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="230" y="859" text-anchor="middle" font-family="Arial" font-size="11">Nhận thông báo nghỉ phép được duyệt</text>

  <!-- ======= PHẦN 3: TỔNG HỢP CÔNG CUỐI KỲ ======= -->
  <line x1="40" y1="910" x2="1240" y2="910" stroke="#aaa" stroke-width="1" stroke-dasharray="8,4"/>
  <rect x="40" y="913" width="230" height="18" fill="#f0f0f0" rx="3"/>
  <text x="155" y="926" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#333" font-weight="bold">③ Luồng Tổng hợp công cuối kỳ (Hệ thống)</text>

  <!-- Initial node tổng hợp -->
  <circle cx="940" cy="955" r="11" fill="#333"/>
  <line x1="940" y1="966" x2="940" y2="993" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Tổng hợp dữ liệu chấm công -->
  <rect x="790" y="998" width="300" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="940" y="1020" text-anchor="middle" font-family="Arial" font-size="11">Tổng hợp dữ liệu chấm công</text>

  <line x1="940" y1="1034" x2="940" y2="1062" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Fork: 3 tính toán song song -->
  <rect x="700" y="1067" width="480" height="5" rx="2" fill="#333"/>

  <line x1="800"  y1="1072" x2="800"  y2="1100" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="710"   y="1105" width="180" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="800"   y="1123" text-anchor="middle" font-family="Arial" font-size="10.5">Tính ngày công thực tế</text>

  <line x1="940"  y1="1072" x2="940"  y2="1100" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="860"   y="1105" width="160" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="940"   y="1127" text-anchor="middle" font-family="Arial" font-size="10.5">Tính giờ OT</text>

  <line x1="1100" y1="1072" x2="1100" y2="1100" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="1020"  y="1105" width="210" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="1125"  y="1120" text-anchor="middle" font-family="Arial" font-size="10.5">Tính phút đi muộn</text>
  <text x="1125"  y="1133" text-anchor="middle" font-family="Arial" font-size="10.5">/ về sớm</text>

  <!-- Join -->
  <line x1="800"  y1="1141" x2="800"  y2="1168" stroke="#333" stroke-width="1.5"/>
  <line x1="940"  y1="1141" x2="940"  y2="1168" stroke="#333" stroke-width="1.5"/>
  <line x1="1100" y1="1141" x2="1100" y2="1168" stroke="#333" stroke-width="1.5"/>
  <rect x="700"   y="1168" width="480" height="5" rx="2" fill="#333"/>

  <line x1="940" y1="1173" x2="940" y2="1200" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Lưu báo cáo công -->
  <rect x="790" y="1205" width="300" height="36" rx="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="940" y="1227" text-anchor="middle" font-family="Arial" font-size="11">Lưu báo cáo công → sẵn sàng cho Payroll</text>

  <!-- Final Node hệ thống -->
  <line x1="940" y1="1241" x2="940" y2="1255" stroke="#333" stroke-width="1.5"/>
  <circle cx="940" cy="1260" r="9" fill="#fff" stroke="#333" stroke-width="2"/>
  <circle cx="940" cy="1260" r="4.5" fill="#333"/>

  <!-- Final Node NV (sau duyệt) -->
  <line x1="230" y1="873" x2="230" y2="900" stroke="#333" stroke-width="1.5"/>
  <circle cx="230" cy="908" r="9" fill="#fff" stroke="#333" stroke-width="2"/>
  <circle cx="230" cy="908" r="4.5" fill="#333"/>

  <!-- ======= LEGEND ======= -->
  <rect x="30" y="1228" width="1220" height="35" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4"/>
  <circle cx="55"  cy="1246" r="5" fill="#333"/>
  <text x="68"  y="1250" font-family="Arial" font-size="9.5" fill="#333">Initial</text>
  <circle cx="115" cy="1246" r="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <circle cx="115" cy="1246" r="3" fill="#333"/>
  <text x="128" y="1250" font-family="Arial" font-size="9.5" fill="#333">Final</text>
  <rect x="175"  y="1238" width="40" height="16" rx="8" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="228"  y="1250" font-family="Arial" font-size="9.5" fill="#333">Activity</text>
  <polygon points="295,1238 308,1246 295,1254 282,1246" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="318"  y="1250" font-family="Arial" font-size="9.5" fill="#333">Decision</text>
  <rect x="390"  y="1243" width="35" height="4" rx="2" fill="#333"/>
  <text x="435"  y="1250" font-family="Arial" font-size="9.5" fill="#333">Fork/Join</text>
  <line x1="505" y1="1246" x2="530" y2="1246" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="540"  y="1250" font-family="Arial" font-size="9.5" fill="#333">Control Flow</text>
  <rect x="640"  y="1239" width="12" height="12" rx="2" fill="#f0f0f0" stroke="#999" stroke-width="0.5"/>
  <text x="657"  y="1250" font-family="Arial" font-size="9.5" fill="#333">Nhân viên</text>
  <rect x="725"  y="1239" width="12" height="12" rx="2" fill="#f0f0f0" stroke="#999" stroke-width="0.5"/>
  <text x="742"  y="1250" font-family="Arial" font-size="9.5" fill="#333">Trưởng phòng</text>
  <rect x="830"  y="1239" width="12" height="12" rx="2" fill="#f0f0f0" stroke="#999" stroke-width="0.5"/>
  <text x="847"  y="1250" font-family="Arial" font-size="9.5" fill="#333">Hệ thống</text>
</svg>
</div>
</body>
</html>
