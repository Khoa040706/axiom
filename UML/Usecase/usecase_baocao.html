<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Use Case – Báo cáo & Quản trị hệ thống</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff;
            display: flex;
            justify-content: center;
            padding: 20px 8px
        }

        .wrap {
            overflow: auto;
            width: 100%
        }

        svg {
            display: block;
            margin: 0 auto
        }
    </style>
</head>

<body>
    <div class="wrap">
        <svg width="1150" height="1200" viewBox="0 0 1150 1200" xmlns="http://www.w3.org/2000/svg"
            style="background:#fff">

            <defs>
                <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
                    <path d="M0,0 L0,7 L9,3.5z" fill="#222" />
                </marker>
                <marker id="o" markerWidth="10" markerHeight="8" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L9,3 L0,6" fill="none" stroke="#555" stroke-width="1.2" />
                </marker>
            </defs>

            <!-- ═══════ SYSTEM BOUNDARY (rộng hơn: x=180, w=770) ═══════ -->
            <rect x="180" y="50" width="770" height="1080" fill="none" stroke="#000" stroke-width="2" rx="4" />
            <text x="565" y="72" text-anchor="middle" font-size="13" font-weight="bold" font-family="Arial">Module: Phân
                hệ Báo
                cáo &amp; Quản trị</text>

            <!-- ══════════════════════════════════════════
                 SECTION 1: Dashboard thống kê  (y 90–340)
            ══════════════════════════════════════════ -->
            <ellipse cx="530" cy="130" rx="175" ry="32" fill="#fff" stroke="#000" stroke-width="1.4" />
            <text x="530" y="134" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Xem
                Dashboard thống kê</text>

            <!-- Sub: Biểu đồ biến động nhân sự (trong khung, x=370) -->
            <ellipse cx="370" cy="225" rx="148" ry="24" fill="#fff" stroke="#000" stroke-width="1"
                stroke-dasharray="5,3" />
            <text x="370" y="229" text-anchor="middle" font-family="Arial" font-size="10">Biểu đồ biến động nhân
                sự</text>
            <line x1="460" y1="162" x2="415" y2="205" stroke="#555" stroke-width="1.1" stroke-dasharray="5,3"
                marker-end="url(#o)" />
            <text x="422" y="188" font-family="Arial" font-size="9" fill="#555">«include»</text>

            <!-- Sub: Thống kê quỹ lương (trong khung, x=720) -->
            <ellipse cx="720" cy="225" rx="148" ry="24" fill="#fff" stroke="#000" stroke-width="1"
                stroke-dasharray="5,3" />
            <text x="720" y="229" text-anchor="middle" font-family="Arial" font-size="10">Thống kê quỹ lương tháng /
                quý</text>
            <line x1="610" y1="162" x2="660" y2="205" stroke="#555" stroke-width="1.1" stroke-dasharray="5,3"
                marker-end="url(#o)" />
            <text x="650" y="188" font-family="Arial" font-size="9" fill="#555">«include»</text>

            <!-- Sub: Tỷ lệ nghỉ việc (giữa) -->
            <ellipse cx="530" cy="315" rx="145" ry="24" fill="#fff" stroke="#000" stroke-width="1"
                stroke-dasharray="5,3" />
            <text x="530" y="319" text-anchor="middle" font-family="Arial" font-size="10">Tỷ lệ nghỉ việc (Turnover
                Rate)</text>
            <line x1="530" y1="162" x2="530" y2="291" stroke="#555" stroke-width="1.1" stroke-dasharray="5,3"
                marker-end="url(#o)" />
            <text x="540" y="240" font-family="Arial" font-size="9" fill="#555">«include»</text>

            <!-- ══════════════════════════════════════════
                 SECTION 2: Báo cáo chi tiết (y 390–780)
                 Layout: 2 hàng × 2 cột, tách rõ ràng
            ══════════════════════════════════════════ -->
            <ellipse cx="530" cy="420" rx="170" ry="32" fill="#fff" stroke="#000" stroke-width="1.4" />
            <text x="530" y="424" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Xem báo cáo
                chi tiết</text>

            <!-- Hàng 1: Headcount (trái) + Lương (phải) — y=530 -->

            <!-- BC Headcount -->
            <ellipse cx="360" cy="530" rx="125" ry="24" fill="#fff" stroke="#000" stroke-width="1"
                stroke-dasharray="5,3" />
            <text x="360" y="534" text-anchor="middle" font-family="Arial" font-size="10">BC Headcount theo PB</text>
            <line x1="450" y1="452" x2="400" y2="510" stroke="#555" stroke-width="1.1" stroke-dasharray="5,3"
                marker-end="url(#o)" />
            <text x="408" y="486" font-family="Arial" font-size="9" fill="#555">«include»</text>

            <!-- BC Lương tổng hợp -->
            <ellipse cx="720" cy="530" rx="120" ry="24" fill="#fff" stroke="#000" stroke-width="1"
                stroke-dasharray="5,3" />
            <text x="720" y="534" text-anchor="middle" font-family="Arial" font-size="10">BC Lương tổng hợp</text>
            <line x1="620" y1="452" x2="670" y2="510" stroke="#555" stroke-width="1.1" stroke-dasharray="5,3"
                marker-end="url(#o)" />
            <text x="660" y="486" font-family="Arial" font-size="9" fill="#555">«include»</text>

            <!-- Hàng 2: Chấm công (trái) + HĐ hết hạn (phải) — y=630 -->

            <!-- BC Chấm công tháng -->
            <ellipse cx="360" cy="630" rx="130" ry="24" fill="#fff" stroke="#000" stroke-width="1"
                stroke-dasharray="5,3" />
            <text x="360" y="634" text-anchor="middle" font-family="Arial" font-size="10">BC Chấm công tháng</text>
            <line x1="490" y1="452" x2="462" y2="610" stroke="#555" stroke-width="1.1" stroke-dasharray="5,3"
                marker-end="url(#o)" />
            <text x="480" y="545" font-family="Arial" font-size="9" fill="#555">«include»</text>

            <!-- BC Hợp đồng sắp hết hạn -->
            <ellipse cx="720" cy="630" rx="145" ry="24" fill="#fff" stroke="#000" stroke-width="1"
                stroke-dasharray="5,3" />
            <text x="720" y="634" text-anchor="middle" font-family="Arial" font-size="10">BC Hợp đồng sắp hết hạn</text>
            <line x1="570" y1="452" x2="650" y2="610" stroke="#555" stroke-width="1.1" stroke-dasharray="5,3"
                marker-end="url(#o)" />
            <text x="630" y="563" font-family="Arial" font-size="9" fill="#555">«include»</text>

            <!-- Xuất báo cáo (riêng biệt, phía dưới giữa, y=730) -->
            <ellipse cx="560" cy="740" rx="120" ry="22" fill="#fff" stroke="#000" stroke-width="1"
                stroke-dasharray="5,3" />
            <text x="560" y="744" text-anchor="middle" font-family="Arial" font-size="10">Xuất báo cáo (Excel /
                PDF)</text>
            <line x1="550" y1="452" x2="555" y2="718" stroke="#000" stroke-width="1.2" stroke-dasharray="6,3"
                marker-end="url(#o)" />
            <rect x="536" y="590" width="52" height="14" fill="#fff" stroke="none" />
            <text x="562" y="601" text-anchor="middle" font-family="Arial" font-size="9"
                font-style="italic">«extend»</text>

            <!-- ══════════════════════════════════════════
                 SECTION 3: RBAC (y 830–1050)
            ══════════════════════════════════════════ -->
            <ellipse cx="530" cy="870" rx="190" ry="32" fill="#fff" stroke="#000" stroke-width="1.4" />
            <text x="530" y="874" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Phân quyền
                theo vai trò (RBAC)</text>

            <!-- Sub: Tạo / khoá tài khoản (trái) -->
            <ellipse cx="370" cy="970" rx="130" ry="24" fill="#fff" stroke="#000" stroke-width="1"
                stroke-dasharray="5,3" />
            <text x="370" y="974" text-anchor="middle" font-family="Arial" font-size="10">Tạo / khoá tài khoản</text>
            <line x1="460" y1="902" x2="415" y2="950" stroke="#555" stroke-width="1.1" stroke-dasharray="5,3"
                marker-end="url(#o)" />
            <text x="420" y="930" font-family="Arial" font-size="9" fill="#555">«include»</text>

            <!-- Sub: Gán vai trò (phải) -->
            <ellipse cx="710" cy="970" rx="140" ry="24" fill="#fff" stroke="#000" stroke-width="1"
                stroke-dasharray="5,3" />
            <text x="710" y="974" text-anchor="middle" font-family="Arial" font-size="10">Gán vai trò (Admin / HR /
                NV)</text>
            <line x1="610" y1="902" x2="660" y2="950" stroke="#555" stroke-width="1.1" stroke-dasharray="5,3"
                marker-end="url(#o)" />
            <text x="650" y="930" font-family="Arial" font-size="9" fill="#555">«include»</text>

            <!-- ═══════ ACTORS ═══════ -->

            <!-- Admin (trái, căn giữa 3 UC chính) -->
            <circle cx="55" cy="540" r="18" fill="#fff" stroke="#000" stroke-width="1.8" />
            <line x1="55" y1="558" x2="55" y2="608" stroke="#000" stroke-width="1.8" />
            <line x1="55" y1="575" x2="28" y2="595" stroke="#000" stroke-width="1.6" />
            <line x1="55" y1="575" x2="82" y2="595" stroke="#000" stroke-width="1.6" />
            <line x1="55" y1="608" x2="30" y2="638" stroke="#000" stroke-width="1.6" />
            <line x1="55" y1="608" x2="80" y2="638" stroke="#000" stroke-width="1.6" />
            <text x="55" y="656" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Admin</text>

            <!-- Ban Lãnh đạo (phải trên) -->
            <circle cx="1095" cy="240" r="18" fill="#fff" stroke="#000" stroke-width="1.8" />
            <line x1="1095" y1="258" x2="1095" y2="308" stroke="#000" stroke-width="1.8" />
            <line x1="1095" y1="275" x2="1068" y2="295" stroke="#000" stroke-width="1.6" />
            <line x1="1095" y1="275" x2="1122" y2="295" stroke="#000" stroke-width="1.6" />
            <line x1="1095" y1="308" x2="1070" y2="338" stroke="#000" stroke-width="1.6" />
            <line x1="1095" y1="308" x2="1120" y2="338" stroke="#000" stroke-width="1.6" />
            <text x="1095" y="356" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">Ban Lãnh
                đạo</text>
            <text x="1095" y="370" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#555">(Director /
                CEO)</text>

            <!-- HR Manager (phải dưới) -->
            <circle cx="1095" cy="570" r="18" fill="#fff" stroke="#000" stroke-width="1.8" />
            <line x1="1095" y1="588" x2="1095" y2="638" stroke="#000" stroke-width="1.8" />
            <line x1="1095" y1="605" x2="1068" y2="625" stroke="#000" stroke-width="1.6" />
            <line x1="1095" y1="605" x2="1122" y2="625" stroke="#000" stroke-width="1.6" />
            <line x1="1095" y1="638" x2="1070" y2="668" stroke="#000" stroke-width="1.6" />
            <line x1="1095" y1="638" x2="1120" y2="668" stroke="#000" stroke-width="1.6" />
            <text x="1095" y="686" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">HR
                Manager</text>

            <!-- ═══════ ASSOCIATIONS ═══════ -->

            <!-- Admin → UC-01, UC-02, UC-03 -->
            <line x1="74" y1="534" x2="355" y2="134" stroke="#000" stroke-width="1.2" marker-end="url(#a)" />
            <line x1="74" y1="542" x2="360" y2="422" stroke="#000" stroke-width="1.2" marker-end="url(#a)" />
            <line x1="74" y1="552" x2="340" y2="870" stroke="#000" stroke-width="1.2" marker-end="url(#a)" />

            <!-- Ban Lãnh đạo → UC-01, UC-02 -->
            <line x1="1076" y1="244" x2="705" y2="134" stroke="#000" stroke-width="1.2" marker-end="url(#a)" />
            <line x1="1076" y1="256" x2="700" y2="422" stroke="#000" stroke-width="1.2" marker-end="url(#a)" />

            <!-- HR Manager → UC-01, UC-02 -->
            <line x1="1076" y1="564" x2="705" y2="138" stroke="#000" stroke-width="1.2" marker-end="url(#a)" />
            <line x1="1076" y1="574" x2="700" y2="426" stroke="#000" stroke-width="1.2" marker-end="url(#a)" />

            <!-- ═══════ LEGEND ═══════ -->
            <rect x="200" y="1145" width="730" height="45" fill="none" stroke="#999" stroke-width="1" rx="3" />
            <text x="565" y="1160" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold"
                fill="#333">Chú thích (Legend)</text>
            <line x1="220" y1="1178" x2="260" y2="1178" stroke="#000" stroke-width="1.5" marker-end="url(#a)" />
            <text x="267" y="1182" font-family="Arial" font-size="10">Association</text>
            <line x1="370" y1="1178" x2="410" y2="1178" stroke="#555" stroke-width="1.1" stroke-dasharray="5,3"
                marker-end="url(#o)" />
            <text x="417" y="1182" font-family="Arial" font-size="10">«include» / «extend»</text>
            <ellipse cx="620" cy="1178" rx="35" ry="10" fill="#fff" stroke="#000" stroke-width="1.4" />
            <text x="620" y="1182" text-anchor="middle" font-family="Arial" font-size="10">UC</text>
            <circle cx="720" cy="1173" r="6" fill="#fff" stroke="#000" stroke-width="1.5" />
            <line x1="720" y1="1179" x2="720" y2="1186" stroke="#000" stroke-width="1.5" />
            <text x="732" y="1182" font-family="Arial" font-size="10">Actor</text>

        </svg>
    </div>
</body>

</html>
